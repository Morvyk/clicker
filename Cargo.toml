[package]
name = "rust-clicker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A system-themed Wayland macro recorder and parallel-device auto clicker"
license = "GPL-3.0-or-later"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "wayland", "tokio", "crisp", "web-colors", "image-without-codecs"] }
evdev = { version = "0.13.2", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
rustix = { version = "1", default-features = false, features = ["std", "event", "fs"] }
freedesktop-icons = { version = "0.4", default-features = false }
resvg = { version = "0.48.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = false
debug-assertions = false
incremental = false

# Pure speed under `cargo run`: fully optimized, no debug info or checks.
# Parallel codegen and incremental builds keep rebuilds reasonably quick.
[profile.dev]
opt-level = 3
debug = false
strip = "none"
overflow-checks = false
debug-assertions = false
codegen-units = 256
incremental = true

[profile.dev.package."*"]
opt-level = 3
debug = false
codegen-units = 16
